<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" width="1040" height="490" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1040" height="490" rx="14" fill="url(#bg10)"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="18" font-weight="700">SEG3502 Lab 10 — Containerized BookStore Architecture (Docker &amp; Kubernetes)</text>
  <text x="32" y="58" fill="#94a3b8" font-size="12">Angular 18 + Nginx · Spring Boot 3.1.1 (Kotlin / HATEOAS / JPA) · MySQL 8/9 · Docker Compose &amp; K8s Manifests</text>

  <!-- Browser / User -->
  <rect x="32" y="138" width="150" height="120" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="107" y="168" text-anchor="middle" fill="#f1f5f9" font-size="13.5" font-weight="700">Browser Client</text>
  <text x="107" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">HTTP :4100 (Compose)</text>
  <text x="107" y="208" text-anchor="middle" fill="#94a3b8" font-size="11">ClusterIP :4100 (K8s)</text>
  <text x="107" y="236" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-family="monospace">/books-api/ calls</text>

  <!-- Cluster / Compose Boundary -->
  <rect x="220" y="84" width="788" height="316" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="240" y="106" fill="#94a3b8" font-size="11.5" font-weight="600">ORCHESTRATION RUNTIME — Docker Compose (mysql-network) / Kubernetes Cluster</text>

  <!-- Arrow Browser -> Frontend -->
  <line x1="182" y1="188" x2="246" y2="188" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="214" y="178" text-anchor="middle" fill="#93c5fd" font-size="10">:4100</text>

  <!-- Frontend Service / Pods -->
  <rect x="250" y="124" width="228" height="175" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="364" y="148" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">booksapp / booksclient</text>
  <text x="364" y="166" text-anchor="middle" fill="#94a3b8" font-size="10.5">books-api-client:latest · K8s replicas: 2</text>
  <rect x="266" y="178" width="196" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="364" y="198" text-anchor="middle" fill="#e2e8f0" font-size="10.5">Nginx :80 · Angular 18 SPA</text>
  <rect x="266" y="218" width="196" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="364" y="233" text-anchor="middle" fill="#38bdf8" font-size="10" font-family="monospace">entrypoint.sh → envsubst</text>
  <text x="364" y="246" text-anchor="middle" fill="#94a3b8" font-size="9.5">env.template.json → env.json</text>
  <text x="364" y="276" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="monospace">API_URL=http://localhost:8080/books-api/</text>

  <!-- Arrow Frontend -> Backend -->
  <line x1="478" y1="188" x2="534" y2="188" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)"/>
  <text x="506" y="178" text-anchor="middle" fill="#6ee7b7" font-size="10">HAL/JSON</text>

  <!-- Backend Service / Pods -->
  <rect x="538" y="124" width="234" height="175" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="655" y="148" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">booksserver</text>
  <text x="655" y="166" text-anchor="middle" fill="#94a3b8" font-size="10.5">books-rest-api:latest · K8s replicas: 2</text>
  <rect x="554" y="178" width="202" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="655" y="198" text-anchor="middle" fill="#e2e8f0" font-size="10.5">Spring Boot 3.1.1 · Port :8080</text>
  <rect x="554" y="218" width="202" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="655" y="233" text-anchor="middle" fill="#a7f3d0" font-size="10" font-family="monospace">Authors · Books · Bios · Orders</text>
  <text x="655" y="246" text-anchor="middle" fill="#94a3b8" font-size="9.5">Spring Data JPA + HATEOAS + OpenAPI</text>
  <text x="655" y="276" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="monospace">depends_on: mysql (healthy)</text>

  <!-- Arrow Backend -> MySQL -->
  <line x1="772" y1="188" x2="824" y2="188" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrPurple)"/>
  <text x="798" y="178" text-anchor="middle" fill="#c4b5fd" font-size="10">:3306</text>

  <!-- MySQL Service -->
  <rect x="828" y="124" width="164" height="175" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="910" y="148" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="700">mysql / mysqldb</text>
  <text x="910" y="166" text-anchor="middle" fill="#94a3b8" font-size="10.5">mysql:9 (Compose) / :8 (K8s)</text>
  <rect x="842" y="178" width="136" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="910" y="198" text-anchor="middle" fill="#e2e8f0" font-size="10.5">Database: booksDb</text>
  <rect x="842" y="218" width="136" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="910" y="233" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="monospace">Headless Service</text>
  <text x="910" y="246" text-anchor="middle" fill="#94a3b8" font-size="9.5">K8s clusterIP: None</text>
  <text x="910" y="276" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="monospace">Strategy: Recreate</text>

  <!-- Persistent Volume -->
  <rect x="828" y="320" width="164" height="64" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="910" y="342" text-anchor="middle" fill="#ddd6fe" font-size="11.5" font-weight="700">Persistent Storage</text>
  <text x="910" y="358" text-anchor="middle" fill="#94a3b8" font-size="10">PV/PVC mysql-data (100Mi)</text>
  <text x="910" y="373" text-anchor="middle" fill="#94a3b8" font-size="10">/var/lib/mysql</text>
  <line x1="910" y1="299" x2="910" y2="318" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrPurple)"/>

  <!-- Multi-stage Docker Build Strip -->
  <rect x="32" y="416" width="976" height="56" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="52" y="439" fill="#f8fafc" font-size="12" font-weight="700">Multi-Stage Image Builds:</text>
  <text x="230" y="439" fill="#93c5fd" font-size="11.5" font-family="monospace">bookstore-client: node:20-alpine (ng build) → nginx:alpine + gettext</text>
  <text x="230" y="458" fill="#6ee7b7" font-size="11.5" font-family="monospace">books-rest-api:   gradle:jdk21-alpine (bootJar) → eclipse-temurin:21-jdk-alpine</text>
</svg>
